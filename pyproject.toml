[project]
name = "llm-etude"
version = "0.1.0"
description = "Tracking my studies through naive-first iteration of LLM concepts."
readme = "README.md"
authors = [
    { name = "Rafael Graunke", email = "rafael.graunke@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "litellm>=1.99.0",
]

[tool.uv]
package = false

[project.scripts]
llm-etude = "llm_etude:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
